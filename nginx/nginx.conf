server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # nginx のバージョンをレスポンスに出さない
    server_tokens off;

    # 課題提出の上限（バックエンド側の 50MB 制限 + 余裕）
    client_max_body_size 60m;

    # --- セキュリティヘッダ ---
    # クリックジャッキング対策
    add_header X-Frame-Options SAMEORIGIN always;
    # MIME スニッフィング対策
    add_header X-Content-Type-Options nosniff always;
    # リファラの送信を最小限に
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # TLS 終端を導入したら有効化すること:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /api/auth/* → NextAuth (Next.js) へ転送
    location ^~ /api/auth/ {
        set                $frontend_upstream frontend:3000;
        proxy_pass         http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # /api/* → FastAPI バックエンドへ転送
    location /api/ {
        set                $backend_upstream backend:8000;
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket サポート（将来的に必要な場合）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # タイムアウト設定
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # その他 → Next.js フロントエンドへ転送
    location / {
        set                $frontend_upstream frontend:3000;
        proxy_pass         http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Next.js の HMR / SSE サポート
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
