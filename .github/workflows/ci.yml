name: CI

on:
  pull_request:
  push:
    branches: [sprint3, main]

# 同じブランチで新しい実行が始まったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # デプロイ・バックアップ系スクリプトの安全装置と、ドキュメントのリンク切れ
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: スクリプトのテスト（deploy / guard / backup / restore / schema_diff / nginx / リンク切れ など）
        run: ./scripts/tests/run_all.sh --no-heavy

  # 実際にイメージをビルドして起動する重い検証（frontend に .env が入らないこと、ログイン制限が本当のIPで効くこと）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: frontend イメージ（.env を含めない・NEXT_PUBLIC_* の焼き込み）
        run: sh scripts/tests/test_frontend_image.sh
      - name: 通しの検証（db / backend / frontend / nginx を起動してログイン制限を確認）
        run: sh scripts/tests/e2e_stack.sh

  # docker compose の設定が（開発用・本番用とも）読み込めること
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: example から .env を用意
        run: |
          cp backend/.env.example backend/.env
          cp frontend/server/.env.example frontend/server/.env
          cp db/.env.example db/.env
          cp tutor/.env.example tutor/.env
      - run: docker compose version
      - run: docker compose -f docker-compose.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  # AI チューターのユニットテスト
  tutor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tutor/requirements.txt
      - name: 依存を固定バージョンで入れる
        working-directory: tutor
        run: pip install -r requirements.txt -c constraints.txt
      - name: ユニットテスト
        working-directory: tutor
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # バックエンドが（ロックどおりの依存で）ビルド・起動できること
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: イメージをビルド
        run: docker build -t lms-backend-ci ./backend
      - name: poetry.lock が pyproject.toml と合っている
        run: docker run --rm --entrypoint "" lms-backend-ci sh -c 'cd /src/backend && poetry check --lock'
      - name: 単体テスト（ログイン試行制限・クライアントIPの決め方）
        run: |
          docker run --rm --entrypoint "" \
            -e SECRET_KEY=ci-test-key \
            -e DATABASE_URL=postgresql+asyncpg://u:p@db:5432/x \
            lms-backend-ci sh -c 'cd /src/backend && poetry run python -m unittest discover -s tests -t . -v'
      - name: アプリを import できる（依存の欠落・非互換の検出）
        run: |
          docker run --rm --entrypoint "" \
            -e SECRET_KEY=ci-test-key \
            -e DATABASE_URL=postgresql+asyncpg://u:p@db:5432/x \
            lms-backend-ci sh -c 'cd /src/backend && poetry run python -c "import api.main; print(len(api.main.app.routes), \"routes\")"'

  # フロントエンドの型チェックと本番ビルド
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 型チェック
        run: npx tsc --noEmit
      - name: 本番ビルド
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_APP_BASE_URL: http://localhost:4000
          NEXTAUTH_URL: http://localhost:4000
