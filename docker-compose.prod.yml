# 本番用オーバーライド
# 使用方法:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# 開発用 (通常通り):
#   docker compose up --build

name: Fast-API-LMS_REACT

services:

  # ---- Backend (本番) ----
  backend:
    restart: unless-stopped
    # 本番ではソースバインドマウントを削除
    volumes: !reset [uploads-data:/app/uploads]
    environment:
      - UPLOAD_ROOT=/app/uploads
    # ホストへのポート公開を削除（nginx 経由のみアクセス）
    ports: !reset []
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- Frontend (本番) ----
  frontend:
    restart: unless-stopped
    # ホットリロード関連の環境変数を削除
    environment:
      - CHOKIDAR_USEPOLLING=
      - HOSTNAME=0.0.0.0
    env_file:
      - ./frontend/server/.env
    # 本番ではソースバインドマウントを削除・command を削除
    volumes: !reset []
    command: !reset null
    tty: false
    stdin_open: false
    privileged: false
    # ポート公開を削除（nginx 経由のみ）
    ports: !reset []
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net'); const t=setTimeout(()=>process.exit(1),5000); const s=net.connect(3000,'127.0.0.1',()=>{clearTimeout(t); s.end(); process.exit(0)}); s.on('error',()=>{clearTimeout(t); process.exit(1)});"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    build:
      args:
        # .env から読み込んだ値をビルド時の ARG として渡す
        - NEXT_PUBLIC_API_BASE_URL
        - NEXT_PUBLIC_APP_BASE_URL
        - NEXTAUTH_URL
        - HTTP_PROXY=${HTTP_PROXY:-http://wwwproxy.kanazawa-it.ac.jp:8080}
        - HTTPS_PROXY=${HTTPS_PROXY:-http://wwwproxy.kanazawa-it.ac.jp:8080}
        - http_proxy=${http_proxy:-http://wwwproxy.kanazawa-it.ac.jp:8080}
        - https_proxy=${https_proxy:-http://wwwproxy.kanazawa-it.ac.jp:8080}

  # ---- DB (本番) ----
  db:
    restart: unless-stopped
    # ホストへのポート公開を廃止（内部ネットワークのみ）
    ports: !reset []

  # ---- init (シード処理: 起動後1回のみ) ----
  init:
    build:
      context: ./backend
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://wwwproxy.kanazawa-it.ac.jp:8080}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://wwwproxy.kanazawa-it.ac.jp:8080}
        http_proxy: ${http_proxy:-http://wwwproxy.kanazawa-it.ac.jp:8080}
        https_proxy: ${https_proxy:-http://wwwproxy.kanazawa-it.ac.jp:8080}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    command:
      - sh
      - -c
      - |
        echo "Running database seeds..."
        poetry run python scripts/seed_users.py
        echo "Seeding complete."

  # ---- Nginx (リバースプロキシ) ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  uploads-data:
