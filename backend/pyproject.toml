# pyproject.toml
[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI LMS Backend"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12" # ここを Python 3.12 に変更
fastapi = "^0.111.0"
alembic = "^1.16.1"
psycopg2-binary = "^2.9.10"
# 2.1 以降は asyncio に必要な greenlet が自動では入らず、(エクストラ無しだと) 起動時に ImportError になる。
# 動作確認済みの 2.0 系に固定し、asyncio エクストラも明示する。
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.41,<2.1"}
python-dotenv = "^1.1.0"
sqlacodegen = "^3.0.0"
pydantic = "^2.11.6"
asyncpg = "^0.30.0"
passlib = "==1.7.4" # 厳密にバージョンを固定
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
pydantic-settings = "^2.9.1"
bcrypt = "==4.0.1" # 厳密にバージョンを固定
uvicorn = {extras = ["standard"], version = "^0.30.1"} # Uvicornも追加 (もしpyproject.tomlに無ければ)
yamale = "^6.0.0"
uuid = "^1.30"
httpx = "^0.27.0" # AI チューター(tutor サービス)への内部プロキシ用
